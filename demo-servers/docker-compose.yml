# 古い版に固定した検証環境。手元だけで使う(ポートは 127.0.0.1 にだけ開く)
name: self-harden-demo

x-trusted: &trusted
  TRUSTED_HOSTS_VALUE: '^localhost$$,^127\.0\.0\.1$$,^server-a$$,^server-b$$,^server-c$$,^server-d$$,^server-e$$,^server-f$$'
  PLANT_DEMO: ${PLANT_DEMO:-1}   # 0 にすると、照らし合わせ用の仕込みを入れない(入られていない状態)

services:
  php-apache-base:
    image: self-harden/php-apache:8.1.10
    build:
      context: .
      dockerfile: common/Dockerfile.php
      args: { BASE: "php:8.1.10-apache" }
    profiles: ["build-only"]

  php-apache74-base:
    image: self-harden/php-apache:7.4
    build:
      context: .
      dockerfile: common/Dockerfile.php
      args: { BASE: "php:7.4-apache" }
    profiles: ["build-only"]

  php-fpm-base:
    image: self-harden/php-fpm:8.1.10
    build:
      context: .
      dockerfile: common/Dockerfile.php
      args: { BASE: "php:8.1.10-fpm" }
    profiles: ["build-only"]

  server-a:
    build: { context: ., dockerfile: server-a/Dockerfile }
    image: self-harden/server-a:dev
    hostname: server-a
    environment:
      <<: *trusted
      SELF_HARDEN_SELF_BASE: http://server-a   # API(docker の中)から店に届く URL
    ports: ["127.0.0.1:8081:80"]
    volumes: ["server-a-docroot:/var/www/html"]
    networks: [self-harden]

  server-b-php:
    build: { context: ., dockerfile: server-b/Dockerfile.php }
    image: self-harden/server-b-php:dev
    hostname: server-b-php
    environment: *trusted
    volumes: ["server-b-docroot:/var/www/html"]
    networks: [self-harden]

  server-b:
    build: { context: ., dockerfile: server-b/Dockerfile.web }
    image: self-harden/server-b-web:dev
    hostname: server-b
    depends_on: [server-b-php]
    ports: ["127.0.0.1:8082:80"]
    volumes: ["server-b-docroot:/var/www/html"]
    networks: [self-harden]

  server-c:
    build: { context: ., dockerfile: server-c/Dockerfile }
    image: self-harden/server-c:dev
    hostname: server-c
    environment:
      <<: *trusted
      SELF_HARDEN_SELF_BASE: http://server-c
      PLANT_DEMO: "0"   # 照らし合わせの仕込みは入れない(パッチ版への上げを見るための台)
    ports: ["127.0.0.1:8083:80"]
    volumes: ["server-c-docroot:/var/www/html"]
    networks: [self-harden]

  server-d:
    build: { context: ., dockerfile: server-d/Dockerfile }
    image: self-harden/server-d:dev
    hostname: server-d
    environment:
      <<: *trusted
      SELF_HARDEN_SELF_BASE: http://server-d
      PLANT_DEMO: "0"
    ports: ["127.0.0.1:8084:80"]
    volumes: ["server-d-docroot:/var/www/html"]
    networks: [self-harden]

  server-e:
    build: { context: ., dockerfile: server-e/Dockerfile }
    image: self-harden/server-e:dev
    hostname: server-e
    environment:
      <<: *trusted
      SELF_HARDEN_SELF_BASE: http://server-e
      PLANT_DEMO: "0"   # 4.1 系。同じ系のパッチ版への上げを見るための台
    ports: ["127.0.0.1:8085:80"]
    volumes: ["server-e-docroot:/var/www/html"]
    networks: [self-harden]

  server-f:
    build: { context: ., dockerfile: server-f/Dockerfile }
    image: self-harden/server-f:dev
    hostname: server-f
    environment:
      <<: *trusted
      SELF_HARDEN_SELF_BASE: http://server-f
      PLANT_DEMO: "0"   # 4.3 系。同じ系の新しい版への上げを見るための台
    ports: ["127.0.0.1:8086:80"]
    volumes: ["server-f-docroot:/var/www/html"]
    networks: [self-harden]

  server-g:
    build: { context: ., dockerfile: server-g/Dockerfile }
    image: self-harden/server-g:dev
    hostname: server-g
    environment:
      SELF_HARDEN_SELF_BASE: http://server-g   # 3.0 系(サポート終了)。3.0 には TRUSTED_HOSTS が無いので渡さない
    ports: ["127.0.0.1:8087:80"]
    # buster の glibc は A と AAAA を同時に問い合わせ、docker の名前解決がときどき片方を落として 5 秒待ちになる。1 つずつ聞かせる
    dns_opt: [single-request]
    volumes: ["server-g-docroot:/var/www/html"]
    networks: [self-harden]

volumes:
  server-a-docroot:
  server-b-docroot:
  server-c-docroot:
  server-d-docroot:
  server-e-docroot:
  server-f-docroot:
  server-g-docroot:

networks:
  self-harden:
    name: self-harden
