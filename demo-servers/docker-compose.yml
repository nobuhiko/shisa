# 古い版に固定した検証環境。手元だけで使う(ポートは 127.0.0.1 にだけ開く)
name: self-harden-demo

x-trusted: &trusted
  TRUSTED_HOSTS_VALUE: '^localhost$$,^127\.0\.0\.1$$,^server-a$$,^server-b$$,^server-c$$'
  PLANT_DEMO: ${PLANT_DEMO:-1}   # 0 にすると、照らし合わせ用の仕込みを入れない(入られていない状態)

services:
  php-apache-base:
    image: self-harden/php-apache:8.1.10
    build:
      context: .
      dockerfile: common/Dockerfile.php
      args: { BASE: "php:8.1.10-apache" }
    profiles: ["build-only"]

  php-fpm-base:
    image: self-harden/php-fpm:8.1.10
    build:
      context: .
      dockerfile: common/Dockerfile.php
      args: { BASE: "php:8.1.10-fpm" }
    profiles: ["build-only"]

  server-a:
    build: { context: ., dockerfile: server-a/Dockerfile }
    image: self-harden/server-a:dev
    hostname: server-a
    environment: *trusted
    ports: ["127.0.0.1:8081:80"]
    volumes: ["server-a-docroot:/var/www/html"]
    networks: [self-harden]

  server-b-php:
    build: { context: ., dockerfile: server-b/Dockerfile.php }
    image: self-harden/server-b-php:dev
    hostname: server-b-php
    environment: *trusted
    volumes: ["server-b-docroot:/var/www/html"]
    networks: [self-harden]

  server-b:
    build: { context: ., dockerfile: server-b/Dockerfile.web }
    image: self-harden/server-b-web:dev
    hostname: server-b
    depends_on: [server-b-php]
    ports: ["127.0.0.1:8082:80"]
    volumes: ["server-b-docroot:/var/www/html"]
    networks: [self-harden]

  server-c:
    build: { context: ., dockerfile: server-c/Dockerfile }
    image: self-harden/server-c:dev
    hostname: server-c
    environment:
      <<: *trusted
      PLANT_DEMO: "0"   # 照らし合わせの仕込みは入れない(パッチ版への上げを見るための台)
    ports: ["127.0.0.1:8083:80"]
    volumes: ["server-c-docroot:/var/www/html"]
    networks: [self-harden]

volumes:
  server-a-docroot:
  server-b-docroot:
  server-c-docroot:

networks:
  self-harden:
    name: self-harden
