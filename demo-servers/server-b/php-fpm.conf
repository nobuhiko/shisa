# .php は PHP-FPM(別のコンテナ server-b-php)に渡す
<FilesMatch "\.php$">
    <If "-f %{REQUEST_FILENAME}">
        SetHandler "proxy:fcgi://server-b-php:9000"
    </If>
</FilesMatch>
# 利用者の .htaccess から PHP_VALUE / PHP_ADMIN_VALUE を FPM に渡させない(共用のレンタルサーバーと同じ扱い)。
# 渡せてしまうと、.htaccess の SetEnv で PHP の設定(管理者向けのものまで)を変えられる
ProxyFCGISetEnvIf "true" !PHP_VALUE
ProxyFCGISetEnvIf "true" !PHP_ADMIN_VALUE
